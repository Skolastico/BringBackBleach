<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">BringBackBleach — registo de progresso, 30 de outubro de 2026</title>
  <desc id="desc">A primeira de quatro etapas está concluída e a segunda está em curso. Redução medida do erro na validação: 47,21 por cento em textura fina, 42,40 por cento em textura intermédia, e estrutura baixa praticamente estável.</desc>
  <rect width="1100" height="650" rx="28" fill="#101722"/>
