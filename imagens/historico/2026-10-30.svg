  <line x1="250" y1="553" x2="840" y2="553" stroke="#8e9aa7" stroke-width="3"/>
  <text x="866" y="561" fill="#f3f5f7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">−0,33% · estável</text>
