  <text x="56" y="448" fill="#dce5ec" font-family="Segoe UI, Arial, sans-serif" font-size="17">Textura fina</text>
  <rect x="250" y="427" width="590" height="28" rx="14" fill="#263545"/>
  <rect x="250" y="427" width="557" height="28" rx="14" fill="#59c7e8"/>
  <text x="866" y="449" fill="#f3f5f7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">47,21%</text>
  <text x="56" y="504" fill="#dce5ec" font-family="Segoe UI, Arial, sans-serif" font-size="17">Textura intermédia</text>
  <rect x="250" y="483" width="590" height="28" rx="14" fill="#263545"/>
  <rect x="250" y="483" width="500" height="28" rx="14" fill="#8a9cff"/>
