  <text x="56" y="101" fill="#aab6c4" font-family="Segoe UI, Arial, sans-serif" font-size="17">Registo de progresso · 30 out 2026</text>
  <rect x="56" y="130" width="988" height="190" rx="18" fill="#192432" stroke="#2b3a4c"/>
  <text x="84" y="170" fill="#f3f5f7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Etapas deste ciclo de investigação</text>
  <text x="84" y="198" fill="#aab6c4" font-family="Segoe UI, Arial, sans-serif" font-size="15">Etapa 1 concluída · etapa 2 em curso · 2 seguintes por fazer</text>
  <rect x="84" y="220" width="220" height="20" rx="10" fill="#63d7b0"/>
  <rect x="316" y="220" width="220" height="20" rx="10" fill="#f4bd62"/>
  <rect x="548" y="220" width="220" height="20" rx="10" fill="#344253"/>
  <rect x="780" y="220" width="220" height="20" rx="10" fill="#344253"/>
  <text x="84" y="268" fill="#dce5ec" font-family="Segoe UI, Arial, sans-serif" font-size="14">Diagnóstico</text>
  <text x="316" y="268" fill="#dce5ec" font-family="Segoe UI, Arial, sans-serif" font-size="14">Rever exemplos</text>
  <text x="548" y="268" fill="#aab6c4" font-family="Segoe UI, Arial, sans-serif" font-size="14">Experiência</text>
  <text x="780" y="268" fill="#aab6c4" font-family="Segoe UI, Arial, sans-serif" font-size="14">Revisão final</text>
  <text x="84" y="296" fill="#aab6c4" font-family="Segoe UI, Arial, sans-serif" font-size="13">A barra representa etapas do ciclo, não a percentagem de conclusão do projeto.</text>
  <text x="56" y="371" fill="#f3f5f7" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Erro médio por escala de detalhe</text>
